# ==============================================================================
# TnT-LLM Prompt Templates — Intent Mining Edition
# ==============================================================================
# Purpose: Generate an INTENT-focused taxonomy from user questions.
# This is Intent Mining, not topic modeling. Each category represents
# a user INTENT (what information the user is trying to find), not just a topic area.
#
# CRITICAL RULES enforced in every prompt:
#   - Use "and" NOT "&" in label names — ever.
#   - No overlapping intents. If two labels describe the same seeking behavior, merge them.
#   - Each label must represent a SINGLE, DISTINCT user intent.
#   - Labels describe what the user WANTS TO KNOW, not just what domain the question is about.

summarize:
  system: >
    You are an expert intent analyst for a question-answering system.
    Your task is to extract the specific INFORMATIONAL INTENT behind a user question —
    what precise fact or answer is the user seeking?
    Describe the intent in terms of the specific knowledge sub-domain involved
    (e.g., "song authorship and release date", "constitutional veto procedure",
    "athletic championship records", "cellular biology mechanisms").
    Use plain English. Use "and" not "&". Output ONLY the summary. Keep it under {target_length} words.
  user: >
    Describe the INFORMATIONAL INTENT of this question in {target_length} words or fewer.
    What specific fact or answer is the user looking for?
    Name the precise knowledge sub-domain — be specific, not generic.
    Use "and" not "&".

    Question: {question}

    Intent Summary:

generate:
  system: >
    You are an intent taxonomy designer for an Intent Mining system.
    You are analyzing user questions to discover what categories of INFORMATION NEED users have.
    Your output MUST be strictly valid JSON — no markdown fences, no explanation, no extra text.
  user: >
    Analyze the following {batch_size} user intent summaries and design exactly {num_labels} distinct intent categories.

    USE CASE: {use_case_instruction}

    MANDATORY RULES — VIOLATING ANY OF THESE WILL MAKE THE OUTPUT USELESS:
    1. USE "and" NOT "&" — NEVER use the ampersand character "&" in any label name or description. Write "and" every single time.
    2. ONE INTENT PER CATEGORY — Each category must represent a single, clearly distinct informational need. If two labels describe similar seeking behavior (e.g., both about entertainment facts), MERGE them into one.
    3. NO GENERIC BUCKETS — Do NOT create umbrella categories like "Science", "History", "Entertainment", "Culture", "Sports", "Society", "Miscellaneous". Every category must be specific enough that you can tell immediately which questions belong.
    4. INTENT-FOCUSED — Each label name should describe what the user WANTS TO KNOW, not just the subject area. Frame it as the type of factual lookup the user is doing.
    5. MUTUALLY EXCLUSIVE — A question should fit cleanly into exactly ONE category. If it could go in two, the categories are too similar and must be merged or sharpened.
    6. COLLECTIVELY EXHAUSTIVE — The {num_labels} categories together must cover all distinct intent patterns in the summaries.
    7. CONSISTENT DEPTH — All categories must be at the same level of specificity.
    8. STRUCTURE:
       - name: 3-{max_label_words} words using "and" (NOT "&"), describing the intent type.
       - description: 1-2 sentences (max {max_desc_words} words) starting with "Seeks facts about..." and specifying what exact information is retrieved.

    Good example label names:
      "Biological Sciences and Human Physiology"
      "Film, Television and Entertainment Media"
      "Music, Artists and Discography"
      "Law, Government and Civic Processes"
      "Sports, Athletics and Competitive Records"

    Bad example label names (DO NOT DO THIS):
      "Film & Television" — ampersand forbidden
      "Entertainment Media" — too generic
      "Scripted Television Narrative & Casting" + "Media Production Logistics & Distribution" — overlapping, should be merged

    USER INTENT SUMMARIES TO ANALYZE:
    {summaries}

    Output a JSON array of exactly {num_labels} objects:
    [
      {{"name": "Intent Category Name", "description": "Seeks facts about ... [specific scope]."}},
      ...
    ]

    JSON OUTPUT:

update:
  system: >
    You are an intent taxonomy specialist refining a category structure for an Intent Mining system.
    Output ONLY valid JSON — no markdown, no explanation.
  user: >
    Refine the intent taxonomy below for the use case: {use_case_instruction}

    CURRENT TAXONOMY:
    {current_taxonomy}

    NEW USER INTENT SUMMARIES:
    {summaries}

    REFINEMENT RULES — APPLY ALL OF THEM:
    1. NEVER use "&" — always write "and" in label names and descriptions.
    2. MERGE any overlapping categories — if two categories describe similar informational needs, combine them into one sharper category.
    3. SPLIT any category that covers two clearly distinct intents into separate categories.
    4. ELIMINATE generic umbrella categories — replace anything too broad with a specific, actionable intent label.
    5. ENSURE each description starts with "Seeks facts about..." and specifies the exact type of lookup.
    6. MAINTAIN exactly {num_labels} categories total.
    7. name: 3-{max_label_words} words with "and" (not "&").
    8. description: max {max_desc_words} words, starting with "Seeks facts about..."

    Output the refined taxonomy as a JSON array:
    [
      {{"name": "Intent Category Name", "description": "Seeks facts about [precise scope]."}},
      ...
    ]

    JSON OUTPUT:

review:
  system: >
    You are a senior Intent Mining taxonomy auditor.
    Your job is to ensure the taxonomy is clean, intent-focused, non-overlapping, and uses proper English.
    Output ONLY the audited taxonomy as valid JSON.
  user: >
    Audit and finalize this intent taxonomy for the use case: {use_case_instruction}

    TAXONOMY TO AUDIT:
    {taxonomy}

    AUDIT CHECKLIST — fix every violation:
    1. AMPERSAND CHECK: Does any label name contain "&"? If yes, replace with "and". This is a hard failure.
    2. OVERLAP CHECK: Are any two categories describing the same user seeking behavior? If yes, merge them and redistribute to maintain {num_labels} total.
    3. GENERICITY CHECK: Are any labels too broad (e.g., "Entertainment", "Science", "History")? Replace with specific, distinct intent labels.
    4. INTENT CHECK: Does each description start with "Seeks facts about..."? If not, rewrite it so it does.
    5. COUNT CHECK: Exactly {num_labels} categories.
    6. NAME LENGTH: 3-{max_label_words} words per name, using "and" not "&".
    7. DESCRIPTION LENGTH: Max {max_desc_words} words each.

    Output the final, corrected taxonomy as a JSON array:
    [
      {{"name": "Intent Category Name", "description": "Seeks facts about [specific scope]."}},
      ...
    ]

    JSON OUTPUT:

evaluate:
  system: >
    You are a taxonomy quality judge for an Intent Mining system.
    Select the taxonomy that best represents distinct, non-overlapping, intent-focused categories.
    Output ONLY a single integer.
  user: >
    Evaluate the candidate taxonomies below for the use case: {use_case_instruction}

    SELECTION CRITERIA (in priority order):
    1. NO AMPERSANDS: Any taxonomy using "&" in label names is penalized. Labels must use "and".
    2. ZERO OVERLAPPING INTENTS: Penalize any taxonomy where two labels describe similar informational needs.
    3. INTENT CLARITY: Labels should clearly describe what the user wants to find out, not just a topic area.
    4. COVERAGE: Covers the diversity of user intents without forcing artificial fits.

    VALIDATION USER INTENT SUMMARIES:
    {summaries}

    CANDIDATE TAXONOMIES:
    {taxonomy_options}

    Reply with ONLY the number of the best taxonomy (e.g. 1 or 2). Do NOT write any other words.

    BEST TAXONOMY NUMBER:

assign:
  system: >
    You are a precise intent classifier for a question-answering Intent Mining system.
    Assign the user question to the single most appropriate intent category from the taxonomy.
    Output ONLY valid JSON.
  user: >
    Classify what the user WANTS TO KNOW from this question into exactly one intent category.

    QUESTION: {question}

    INTENT TAXONOMY:
    {taxonomy}

    Output format (JSON only, no other text):
    {{"primary_label": "Exact Intent Category Name", "confidence": "high/medium/low", "reasoning": "One sentence: what specific fact the user seeks and why this category fits."}}

    JSON OUTPUT:
