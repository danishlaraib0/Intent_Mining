# ==========================================
# TnT-LLM Pipeline Configuration
# ==========================================

project:
  name: "nq-taxonomy-generation"
  root_dir: "."
  data_dir: "dataset"
  output_dir: "output"

# --- Corpus ---
corpus:
  path: "dataset/NQ-open.efficientqa.dev.1.1.no-annotations.jsonl"
  text_field: "question"            # JSON key holding the text
  total_records: 1800
  sample_size: 100                  # Quick run: 100 questions (set null for full dataset)
  val_ratio: 0.2                    # 20% held out for validation-based taxonomy selection
  random_seed: 42

# --- LLM Provider ---
llm:
  # Primary model: Qwen 3.8-27B on Groq
  primary:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
    temperature_summarize: 0.2       # Low temp for summarization
    temperature_generate: 0.5        # Higher temp for taxonomy generation
    temperature_update: 0.2          # Lower temp for taxonomy update
    temperature_review: 0.0          # Deterministic for review
    top_p: 0.95
    max_completion_tokens: 2048
    reasoning_effort: "default"

  # Fallback model: GPT-OSS-20B on Groq
  fallback:
    provider: "groq"
    model: "openai/gpt-oss-20b"
    temperature_summarize: 0.2
    temperature_generate: 0.5
    temperature_update: 0.2
    temperature_review: 0.0
    top_p: 0.95
    max_completion_tokens: 2048

  # Rate limits (apply to BOTH models combined — same Groq account)
  rate_limits:
    requests_per_minute: 30
    requests_per_day: 1000
    tokens_per_minute: 8000
    tokens_per_day: 200000
    # Derived safe settings
    batch_size: 10                   # Process 10 docs per batch
    delay_between_requests: 2.5      # seconds between individual requests (30 RPM → 2s + buffer)
    delay_between_batches: 25        # seconds between batches of 10 (safety margin)
    max_retries: 3
    retry_delay: 10                  # seconds to wait on rate limit error

# --- Prompts & Logging Configuration ---
prompts:
  path: "config/prompts.yaml"

logging:
  dir: "logs"

# --- Phase 1: Taxonomy Generation ---
phase1:
  # Stage 1: Summarization
  summarization:
    target_length_words: 15          # Short summaries for questions
    output_file: "summaries.jsonl"

  # Stage 2: Taxonomy Generation (SGD-style)
  taxonomy:
    num_labels: 10                   # Target number of taxonomy labels
    max_label_words: 5               # Max words per label name
    max_desc_words: 40               # Max words per label description
    minibatch_size: 40               # Summaries per taxonomy update batch
    num_trials: 2                    # 2 trials with validation model selection
    num_epochs: 1                    # Epochs over data per trial
    output_dir: "taxonomies"

  # Use-case instruction (Enforces Granular, Insightful, Non-Generic Taxonomy)
  use_case:
    name: "granular_knowledge_domain"
    instruction: >
      Discover a granular, high-resolution taxonomy of specific knowledge domains and subdisciplines
      represented in user factual queries.
      Do NOT produce generic top-level umbrella categories (such as "Science", "History", "Sports", "Geography", "Entertainment", "Culture").
      Instead, uncover insightful, domain-specific subdisciplines (e.g., "Cellular Biology & Molecular Genetics",
      "Constitutional Law & Treaties", "Orbital Mechanics & Planetary Astronomy", "Cinematic Screenwriting & Directing",
      "Military Operations & Armed Conflicts", "Electoral Systems & Legislative Politics", "Classical Literature & Literary Devices").
      Categories must be mutually exclusive, collectively exhaustive, and provide deep analytical insight.

# --- Phase 2: Label Assignment (No Classifier Training) ---
phase2:
  label_assignment:
    batch_size: 10
    output_file: "labeled_questions.jsonl"
