# ==============================================================================
# TnT-LLM Prompt Templates (Externalized)
# ==============================================================================
# All prompts are configured here rather than hardcoded in Python.
# Variables like {question}, {summaries}, {taxonomy}, etc. are interpolated at runtime.

summarize:
  system: >
    You are an expert analytical taxonomist. Your task is to extract the granular,
    specific knowledge domain and topical focus of user questions.
    Avoid broad, generic labels like "Science", "History", or "Culture".
    Instead, identify the precise sub-discipline, technical field, or specific thematic area
    (e.g., "Molecular Genetics & Cellular Biology", "Constitutional Law & Treaties", "Orbital Mechanics").
    Output ONLY the concise summary. Keep it under {target_length} words.
  user: >
    Extract the granular subject area and technical topic of this question in {target_length} words or fewer.
    Capture the specific sub-discipline, mechanism, or analytical theme.
    Do NOT output generic categories like "Science", "History", "Geography", or "Sports".

    Question: {question}

    Granular Summary:

generate:
  system: >
    You are a principal taxonomist designing a high-resolution, insight-rich topic taxonomy.
    Your output MUST be strictly valid JSON without markdown fences, explanation, or commentary.
  user: >
    Analyze the following {batch_size} granular question summaries and create a high-resolution taxonomy of exactly {num_labels} distinct categories.

    USE CASE: {use_case_instruction}

    CRITICAL TAXONOMY REQUIREMENTS:
    1. GRANULAR & INSIGHTFUL: Do NOT use generic top-level umbrella categories (such as "Science", "History", "Geography", "Entertainment", "Culture", "Sports", "Society").
       Instead, generate domain-specific, analytically sharp categories (e.g., "Cellular Biology & Biochemical Mechanisms", "Constitutional Law & Treaty Frameworks", "Planetary Astronomy & Space Exploration", "Cinematic Directing & Screenplay Adaptations", "Military Logistics & Armed Conflicts", "Electoral Politics & Legislative Systems").
    2. MUTUALLY EXCLUSIVE: Each category must have a distinct boundary so items do not fit equally well into multiple labels.
    3. COLLECTIVELY EXHAUSTIVE: Together, the {num_labels} categories must thoroughly cover all patterns observed in the input summaries.
    4. CONSISTENT GRANULARITY: All {num_labels} categories must be at the same depth and specificity.
    5. STRUCTURE:
       - name: 2-{max_label_words} words, specific and descriptive.
       - description: 1-2 detailed sentences (max {max_desc_words} words) stating exact scope, key themes, and criteria for inclusion.

    QUESTION SUMMARIES TO ANALYZE:
    {summaries}

    Output format (strictly a JSON array of objects):
    [
      {{"name": "Sub-Discipline Name", "description": "Specific analytical scope, including what subtopics and question types belong here."}},
      ...
    ]

    JSON OUTPUT:

update:
  system: >
    You are an expert taxonomist refining a category structure using new observational data.
    Your task is to adapt, split, refine, or merge categories to maximize granularity and fit.
    Output ONLY valid JSON — no markdown, no explanation.
  user: >
    You are iteratively refining an insight-rich topic taxonomy for the use case:
    {use_case_instruction}

    CURRENT TAXONOMY:
    {current_taxonomy}

    NEW BATCH OF GRANULAR QUESTION SUMMARIES:
    {summaries}

    REFINEMENT INSTRUCTIONS:
    1. DIAGNOSE GAPS & OVERLAPS: Identify which summaries fail to fit cleanly into existing categories, or which categories are too generic/broad.
    2. SHARPEN GRANULARITY: Replace any lingering generic categories with insightful, specialized sub-fields. Ensure categories remain distinct and mutually exclusive.
    3. MAINTAIN BALANCE: Keep exactly {num_labels} high-quality categories.
    4. FORMAT:
       - name: 2-{max_label_words} words, precise and insightful.
       - description: 1-2 sentences (max {max_desc_words} words) detailing criteria and distinguishing boundaries.

    Output the revised taxonomy as a JSON array:
    [
      {{"name": "Granular Category Name", "description": "Precise description with distinguishing criteria."}},
      ...
    ]

    JSON OUTPUT:

review:
  system: >
    You are a lead taxonomy auditor. Polish and standardize the taxonomy to ensure maximum clarity, semantic separation, and deep granularity.
    Output ONLY the final reviewed taxonomy as valid JSON.
  user: >
    Perform a rigorous audit and polish on this taxonomy for the use case: {use_case_instruction}

    TAXONOMY TO AUDIT:
    {taxonomy}

    AUDIT CHECKLIST:
    1. GRANULARITY CHECK: Ensure NO categories are generic buckets (e.g., reject "General Science", "History", "Miscellaneous"). All labels must represent insightful, distinct subdisciplines.
    2. MUTUAL EXCLUSIVITY: Remove any semantic ambiguity or boundary overlap between categories.
    3. LABEL NAMES: Concise, professional names (2-{max_label_words} words).
    4. DESCRIPTIONS: Clear, actionable descriptions (max {max_desc_words} words).
    5. COUNT: Exactly {num_labels} categories.

    Output the perfected taxonomy as a JSON array:
    [
      {{"name": "Granular Category Name", "description": "Refined criteria and boundaries."}},
      ...
    ]

    JSON OUTPUT:

evaluate:
  system: >
    You are an unbiased taxonomy evaluation judge. Given a validation sample of questions and candidate taxonomies,
    select the taxonomy with superior granularity, precision, mutual exclusivity, and data coverage.
    Output ONLY the single integer index of the winning taxonomy.
  user: >
    Evaluate the following candidate taxonomies against a validation sample of question summaries.
    USE CASE: {use_case_instruction}

    CRITERIA FOR SELECTION:
    1. Granularity & Insight: Prefers taxonomies that uncover insightful, specific sub-disciplines over shallow generic categories.
    2. Coverage: Effectively accommodates the diversity of questions without forcing artificial fits.
    3. Mutual Exclusivity: Minimal overlap between categories.

    VALIDATION QUESTION SUMMARIES:
    {summaries}

    CANDIDATE TAXONOMIES:
    {taxonomy_options}

    Reply with ONLY the single number of the best taxonomy (e.g. 1 or 2). Do NOT write any other words.

    BEST TAXONOMY NUMBER:

assign:
  system: >
    You are a precise semantic classifier. Assign the input question to the single best fitting category from the granular taxonomy.
    Output ONLY valid JSON.
  user: >
    Classify the question into the most appropriate category from the granular taxonomy below.

    QUESTION: {question}

    GRANULAR TAXONOMY:
    {taxonomy}

    Output format (JSON):
    {{"primary_label": "Exact Label Name", "confidence": "high/medium/low", "reasoning": "One concise sentence explaining why the question fits this specific category."}}

    JSON OUTPUT:
